name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        run: ./script/build_and_run.sh --headless
      - name: Test
        run: ./script/test.sh
      - name: Verify sandboxed Release build
        run: ./script/release.sh --local
